<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Scanner Barcode - Product Info V2</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .status {
      margin: 15px auto;
      padding: 12px;
      border-radius: 10px;
      background: #e3f2fd;
      color: #1565c0;
      font-weight: bold;
      font-size: 14px;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 6px;
    }

    #startBtn {
      background: #198754;
      color: white;
    }

    #closeBtn {
      background: #dc3545;
      color: white;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      display: none;
    }

    .barcode-result {
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    .small {
      font-size: 12px;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 SCAN BARCODE</h2>

  <div class="subtitle">
    Arahkan kamera ke barcode barang
  </div>

  <div id="status" class="status">
    Menyiapkan kamera...
  </div>

  <div id="reader"></div>

  <div id="result">
    <div>Barcode terbaca:</div>
    <div id="barcodeValue" class="barcode-result"></div>
  </div>

  <div style="margin-top:15px;">
    <button id="startBtn" onclick="mulaiKamera()">
      📷 MULAI KAMERA
    </button>

    <button id="closeBtn" onclick="tutupScanner()">
      ✖ TUTUP
    </button>
  </div>

  <div class="small">
    Product Info V2 Scanner
  </div>

</div>

<script>

let scanner = null;
let sedangScan = false;
let sudahBerhasil = false;


// ==============================
// STATUS
// ==============================

function setStatus(text, type = "info") {

  const el = document.getElementById("status");

  el.innerText = text;

  el.className = "status";

  if (type === "error") {
    el.classList.add("error");
  }
}


// ==============================
// MULAI KAMERA
// ==============================

function mulaiKamera() {

  if (sedangScan) return;

  sudahBerhasil = false;

  setStatus("Meminta izin kamera...");

  if (!scanner) {
    scanner = new Html5Qrcode("reader");
  }

  const config = {

    fps: 10,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const width =
        Math.min(viewfinderWidth * 0.85, 350);

      const height =
        Math.min(viewfinderHeight * 0.30, 150);

      return {
        width: width,
        height: height
      };
    },

    aspectRatio: 1.777778,

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF_14,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE

    ]
  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,


    function(decodedText, decodedResult) {

      if (sudahBerhasil) return;

      sudahBerhasil = true;

      console.log(
        "Barcode terbaca:",
        decodedText
      );

      setStatus(
        "✅ Barcode berhasil dibaca!"
      );

      document.getElementById(
        "barcodeValue"
      ).innerText = decodedText;

      document.getElementById(
        "result"
      ).style.display = "block";


      kirimKeDashboard(decodedText);

    },


    function(errorMessage) {

      // Tidak perlu menampilkan error scan
      // karena callback ini dipanggil terus
      // selama kamera mencari barcode.

    }

  )

  .then(function() {

    sedangScan = true;

    setStatus(
      "📷 Kamera aktif — arahkan ke barcode"
    );

  })

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );

    sedangScan = false;

    setStatus(
      "❌ Kamera gagal dibuka: " + error,
      "error"
    );

    alert(
      "Gagal mengakses kamera.\n\n" +
      "Pastikan izin kamera diberikan " +
      "untuk situs GitHub Pages ini."
    );

  });

}


// ==============================
// KIRIM BARCODE KE DASHBOARD
// ==============================

function kirimKeDashboard(barcode) {

  setStatus(
    "Barcode ditemukan. Mengirim ke Dashboard..."
  );


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type: "PRODUCT_INFO_BARCODE",
        barcode: String(barcode)
      },

      "*"

    );


    setTimeout(
      function() {
        tutupScanner();
      },
      700
    );

  }

  else {

    setStatus(
      "⚠️ Dashboard tidak ditemukan. Jangan buka scanner secara manual.",
      "error"
    );

  }

}


// ==============================
// TUTUP SCANNER
// ==============================

function tutupScanner() {

  if (
    scanner &&
    sedangScan
  ) {

    scanner.stop()

      .then(function() {

        sedangScan = false;

        try {
          scanner.clear();
        }
        catch(e) {}

        window.close();

      })

      .catch(function(error) {

        console.error(
          "Gagal menghentikan kamera:",
          error
        );

        try {
          scanner.clear();
        }
        catch(e) {}

        window.close();

      });

  }

  else {

    window.close();

  }

}


// ==============================
// OTOMATIS MULAI
// ==============================

window.addEventListener(
  "load",
  function() {

    setTimeout(
      mulaiKamera,
      500
    );

  }
);

</script>

</body>
</html>
